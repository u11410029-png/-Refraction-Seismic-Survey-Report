<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1000 720" width="1000" height="720"
     font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none" stroke="#4a6c8e" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <pattern id="soil" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#f1dfba"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#d8bd8a" stroke-width="1.2"/>
    </pattern>
    <pattern id="rock" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#b7c4d1"/>
      <circle cx="6" cy="7" r="1.7" fill="#94a4b4"/>
      <circle cx="15" cy="14" r="1.3" fill="#94a4b4"/>
    </pattern>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#334155"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0284c7"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#16a34a"/>
    </marker>
    <marker id="arrY" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ca8a04"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="1000" height="720" fill="#fbf9f4"/>
  <rect x="0" y="0" width="1000" height="720" fill="url(#grid)"/>

  <!-- header -->
  <text x="40" y="42" font-size="23" font-weight="700" fill="#1e293b">實測地下地質／地形剖面圖（測線 0 – 46 m）</text>
  <text x="40" y="66" font-size="12.5" fill="#64748b">臺北市立大學圖書館後方測線（由北向南）｜24 支檢波器（間距 2 m）｜12 個炮點（間距 4 m）｜人工鐵鎚震源</text>

  <!-- compass -->
  <g>
    <path d="M905 118 L885 104 M905 118 L925 104" fill="none" stroke="#334155" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M905 118 L885 104" fill="none" stroke="#334155" stroke-width="2.4" marker-end="url(#arrK)"/>
    <text x="905" y="140" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">N 北</text>
  </g>

  <!-- sky / above ground -->
  <rect x="40" y="78" width="920" height="290" fill="#ffffff" fill-opacity="0.45"/>

  <!-- bedrock (V2) -->
  <rect x="40" y="340" width="920" height="122" fill="url(#rock)"/>
  <!-- overburden (V1) -->
  <path d="M100,120 L136.1,122 L172.2,116 L208.2,112 L244.3,115 L280.4,109 L316.5,107 L352.6,112 L388.7,114 L424.8,108 L460.9,105 L497,110 L533,113 L569.1,108 L605.2,111 L641.3,114 L677.4,109 L713.5,113 L749.6,116 L785.7,112 L821.7,115 L857.8,111 L893.9,114 L930,117 L930,340 L100,340 Z"
        fill="url(#soil)"/>

  <!-- interface -->
  <line x1="40" y1="340" x2="960" y2="340" stroke="#334155" stroke-width="3.2"/>
  <!-- ground surface -->
  <path d="M100,120 L136.1,122 L172.2,116 L208.2,112 L244.3,115 L280.4,109 L316.5,107 L352.6,112 L388.7,114 L424.8,108 L460.9,105 L497,110 L533,113 L569.1,108 L605.2,111 L641.3,114 L677.4,109 L713.5,113 L749.6,116 L785.7,112 L821.7,115 L857.8,111 L893.9,114 L930,117"
        fill="none" stroke="#7c2d12" stroke-width="3.4" stroke-linejoin="round"/>

  <!-- layer labels -->
  <text x="196" y="228" font-size="16" font-weight="700" fill="#7c2d12">風化表土層（覆蓋層）</text>
  <text x="196" y="254" font-size="15" font-weight="700" fill="#ea580c">V₁ = 326 m/s</text>
  <text x="196" y="398" font-size="16" font-weight="700" fill="#1e293b">堅硬基盤（砂岩／頁岩）</text>
  <text x="196" y="424" font-size="15" font-weight="700" fill="#0284c7">V₂ = 2,833 m/s</text>
  <text x="742" y="332" font-size="12.5" font-weight="700" fill="#475569">基盤界面</text>

  <!-- thickness h -->
  <line x1="912" y1="115" x2="912" y2="340" stroke="#16a34a" stroke-width="2.4"
        marker-start="url(#arrG)" marker-end="url(#arrG)"/>
  <text x="902" y="228" font-size="14" font-weight="700" fill="#16a34a" text-anchor="end">h = 6.68 m</text>
  <text x="902" y="248" font-size="11.5" fill="#16a34a" text-anchor="end">表土層厚度</text>

  <!-- shot point hammers -->
  <g stroke="#7c2d12" stroke-width="2.6" stroke-linecap="round">
    <line x1="100" y1="96" x2="100" y2="114"/>
    <line x1="172.2" y1="92" x2="172.2" y2="110"/>
    <line x1="244.3" y1="91" x2="244.3" y2="109"/>
    <line x1="316.5" y1="83" x2="316.5" y2="101"/>
    <line x1="388.7" y1="90" x2="388.7" y2="108"/>
    <line x1="460.9" y1="81" x2="460.9" y2="99"/>
    <line x1="533" y1="89" x2="533" y2="107"/>
    <line x1="605.2" y1="87" x2="605.2" y2="105"/>
    <line x1="677.4" y1="85" x2="677.4" y2="103"/>
    <line x1="749.6" y1="92" x2="749.6" y2="110"/>
    <line x1="821.7" y1="91" x2="821.7" y2="109"/>
    <line x1="893.9" y1="90" x2="893.9" y2="108"/>
  </g>
  <g fill="#7c2d12">
    <rect x="92" y="86" width="16" height="6" rx="2"/>
    <rect x="164.2" y="82" width="16" height="6" rx="2"/>
    <rect x="236.3" y="81" width="16" height="6" rx="2"/>
    <rect x="308.5" y="73" width="16" height="6" rx="2"/>
    <rect x="380.7" y="80" width="16" height="6" rx="2"/>
    <rect x="452.9" y="71" width="16" height="6" rx="2"/>
    <rect x="525" y="79" width="16" height="6" rx="2"/>
    <rect x="597.2" y="77" width="16" height="6" rx="2"/>
    <rect x="669.4" y="75" width="16" height="6" rx="2"/>
    <rect x="741.6" y="82" width="16" height="6" rx="2"/>
    <rect x="813.7" y="81" width="16" height="6" rx="2"/>
    <rect x="885.9" y="80" width="16" height="6" rx="2"/>
  </g>
  <g fill="#dc2626" stroke="#fff" stroke-width="1.4">
    <circle cx="100" cy="120" r="4.6"/>
    <circle cx="172.2" cy="116" r="4.6"/>
    <circle cx="244.3" cy="115" r="4.6"/>
    <circle cx="316.5" cy="107" r="4.6"/>
    <circle cx="388.7" cy="114" r="4.6"/>
    <circle cx="460.9" cy="105" r="4.6"/>
    <circle cx="533" cy="113" r="4.6"/>
    <circle cx="605.2" cy="111" r="4.6"/>
    <circle cx="677.4" cy="109" r="5.8"/>
    <circle cx="749.6" cy="116" r="4.6"/>
    <circle cx="821.7" cy="115" r="4.6"/>
    <circle cx="893.9" cy="114" r="4.6"/>
  </g>

  <!-- geophone stems + bodies -->
  <path d="M100,120 v10 M136.1,122 v10 M172.2,116 v10 M208.2,112 v10 M244.3,115 v10 M280.4,109 v10 M316.5,107 v10 M352.6,112 v10 M388.7,114 v10 M424.8,108 v10 M460.9,105 v10 M497,110 v10 M533,113 v10 M569.1,108 v10 M605.2,111 v10 M641.3,114 v10 M677.4,109 v10 M713.5,113 v10 M749.6,116 v10 M785.7,112 v10 M821.7,115 v10 M857.8,111 v10 M893.9,114 v10 M930,117 v10"
        fill="none" stroke="#334155" stroke-width="2.2"/>
  <path d="M94,130 L106,130 L100,140 Z M130.1,132 L142.1,132 L136.1,142 Z M166.2,126 L178.2,126 L172.2,136 Z M202.2,122 L214.2,122 L208.2,132 Z M238.3,125 L250.3,125 L244.3,135 Z M274.4,119 L286.4,119 L280.4,129 Z M310.5,117 L322.5,117 L316.5,127 Z M346.6,122 L358.6,122 L352.6,132 Z M382.7,124 L394.7,124 L388.7,134 Z M418.8,118 L430.8,118 L424.8,128 Z M454.9,115 L466.9,115 L460.9,125 Z M491,120 L503,120 L497,130 Z M527,123 L539,123 L533,133 Z M563.1,118 L575.1,118 L569.1,128 Z M599.2,121 L611.2,121 L605.2,131 Z M635.3,124 L647.3,124 L641.3,134 Z M671.4,119 L683.4,119 L677.4,129 Z M707.5,123 L719.5,123 L713.5,133 Z M743.6,126 L755.6,126 L749.6,136 Z M779.7,122 L791.7,122 L785.7,132 Z M815.7,125 L827.7,125 L821.7,135 Z M851.8,121 L863.8,121 L857.8,131 Z M887.9,124 L899.9,124 L893.9,134 Z M924,127 L936,127 L930,137 Z"
        fill="#1e293b"/>

  <!-- highlight crossover channel Chan 9 -->
  <circle cx="388.7" cy="124" r="11" fill="none" stroke="#ca8a04" stroke-width="3"/>
  <!-- highlight Shot 109 -->
  <circle cx="677.4" cy="109" r="15" fill="none" stroke="#ca8a04" stroke-width="3"/>

  <!-- channel labels -->
  <g font-size="12" fill="#475569">
    <line x1="100" y1="140" x2="100" y2="162" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="100" y="176">Chan 1（0 m）</text>
    <line x1="388.7" y1="134" x2="388.7" y2="196" stroke="#ca8a04" stroke-width="1.4"/>
    <text x="388.7" y="210" font-size="12.5" font-weight="700" fill="#ca8a04" text-anchor="middle">Chan 9｜交會測站</text>
    <text x="388.7" y="226" font-size="11.5" fill="#ca8a04" text-anchor="middle">Xc = 15.0 m（支距）</text>
    <line x1="677.4" y1="129" x2="677.4" y2="196" stroke="#ca8a04" stroke-width="1.4"/>
    <text x="677.4" y="210" font-size="12.5" font-weight="700" fill="#ca8a04" text-anchor="middle">Chan 17（32 m）｜Shot 109 基準炮點</text>
    <line x1="930" y1="137" x2="930" y2="162" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="930" y="176" text-anchor="end">Chan 24（46 m）</text>
  </g>

  <!-- observation direction -->
  <line x1="668" y1="196" x2="118" y2="196" stroke="#0284c7" stroke-width="2.6" marker-end="url(#arrB)"/>
  <text x="393" y="188" font-size="12.5" font-weight="700" fill="#0284c7" text-anchor="middle">觀測方向（自 Shot 109 向北，支距 0 → 32 m）</text>

  <!-- scale bar -->
  <g>
    <rect x="100" y="470" width="90.2" height="8" fill="#334155"/>
    <rect x="190.2" y="470" width="90.2" height="8" fill="#fff" stroke="#334155" stroke-width="1.2"/>
    <text x="100" y="492" font-size="11.5" fill="#475569">0</text>
    <text x="190" y="492" font-size="11.5" fill="#475569" text-anchor="middle">10</text>
    <text x="280" y="492" font-size="11.5" fill="#475569" text-anchor="middle">20 m</text>
  </g>
  <!-- legend -->
  <g font-size="12" fill="#334155">
    <rect x="430" y="462" width="14" height="14" fill="#1e293b"/>
    <text x="452" y="474">檢波器 × 24</text>
    <circle cx="570" cy="469" r="6" fill="#dc2626" stroke="#fff" stroke-width="1.4"/>
    <text x="582" y="474">炮點 × 12（人工鐵鎚）</text>
    <rect x="722" y="462" width="14" height="14" fill="#f1dfba" stroke="#7c2d12" stroke-width="1.4"/>
    <text x="744" y="474">風化表土 V₁</text>
    <rect x="838" y="462" width="14" height="14" fill="#b7c4d1" stroke="#334155" stroke-width="1.4"/>
    <text x="860" y="474">基盤 V₂</text>
  </g>

  <!-- info cards -->
  <g>
    <rect x="40" y="506" width="450" height="96" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
    <text x="58" y="530" font-size="13.5" font-weight="700" fill="#1e293b">① 測線與布設</text>
    <text x="58" y="552" font-size="12" fill="#475569">測線長 46 m（北市大圖書館後方，由北向南）</text>
    <text x="58" y="571" font-size="12" fill="#475569">24 支檢波器（間距 2 m）｜12 個炮點（間距 4 m）</text>
    <text x="58" y="590" font-size="12" fill="#475569">人工鐵鎚震源，Shot 109 為基準炮（Chan 17, 32 m）</text>

    <rect x="510" y="506" width="450" height="96" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
    <text x="528" y="530" font-size="13.5" font-weight="700" fill="#1e293b">② 介質參數（雙層模型）</text>
    <text x="528" y="552" font-size="12" fill="#ea580c" font-weight="700">V₁ = 326 m/s（風化表土／覆蓋層）</text>
    <text x="528" y="571" font-size="12" fill="#0284c7" font-weight="700">V₂ = 2,833 m/s（堅硬基盤）</text>
    <text x="528" y="590" font-size="12" fill="#16a34a" font-weight="700">h = 6.68 m（界面深度）｜臨界角 θc = 6.61°</text>

    <rect x="40" y="612" width="450" height="96" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
    <text x="58" y="636" font-size="13.5" font-weight="700" fill="#1e293b">③ 關鍵觀測</text>
    <text x="58" y="658" font-size="12" fill="#ca8a04" font-weight="700">超越距離 Xc = 15.0 m（交會測站 Chan 9 附近）</text>
    <text x="58" y="677" font-size="12" fill="#ca8a04" font-weight="700">交會到時 tc = 46 ms｜截距時間 Ti = 40.7 ms</text>
    <text x="58" y="696" font-size="12" fill="#475569">遠端驗證點：Chan 1（0 m，支距 32 m，t = 52 ms）</text>

    <rect x="510" y="612" width="450" height="96" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.6"/>
    <text x="528" y="636" font-size="13.5" font-weight="700" fill="#1e293b">④ 判讀說明</text>
    <text x="528" y="658" font-size="12" fill="#475569">近支距 &lt; 8 m 受地滾波（127–160 m/s）干擾</text>
    <text x="528" y="677" font-size="12" fill="#475569">自動演算法易誤抓波峰 → 採人工眼挑初達波</text>
    <text x="528" y="696" font-size="12" fill="#475569">走時取樣間隔 0.25 ms（毫秒級量測精度）</text>
  </g>
</svg>
